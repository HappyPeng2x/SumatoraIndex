name: Release dictionaries

# Rebuilds every installable pack from upstream JMdict/JMnedict/KANJIDIC2/
# Tatoeba/UniDic, publishes them as a GitHub Release on this repo, and
# updates dictionaries.xml on `master` to point at the new release. See
# release-pipeline.md for the full design and why this lives here (rather
# than in a client app repo like SumatoraDictionary): SumatoraIndex is the
# single upstream producer every client (Android, desktop, PWA) should fetch
# from, so there is exactly one canonical release/manifest location.
#
# Runs on a weekly schedule to keep pace with upstream JMdict's release
# cadence and give users a sense of freshness, and can always be triggered
# manually.

on:
  workflow_dispatch:
    inputs:
      pack_langs:
        description: >-
          Comma-separated gloss/example language codes to build packs for.
          Leave as-is for the standard curated set; use "all" to build every
          language SumatoraIndex has translation data for (much larger, many
          low-traffic languages).
        required: false
        default: eng,ger,rus,spa,dut,hun,swe,fre,slv
  schedule:
    - cron: '0 3 * * 1'  # 03:00 UTC every Monday

permissions:
  contents: write

concurrency:
  group: release-dictionaries
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    # `if:` conditions can't reference `secrets` directly (GitHub Actions
    # rejects it at parse time: "Unrecognized named-value: 'secrets'") --
    # route it through a job-level env var instead, which `if:` can read.
    env:
      DICT_REPOS_PAT_SET: ${{ secrets.DICT_REPOS_PAT != '' }}
    steps:
      - name: Check out SumatoraIndex
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: pip install lxml fugashi

      # Every *-to-git.py step re-downloads its upstream source through
      # ensure_cached()'s conditional-GET cache, so restoring a previous
      # run's cache just turns unchanged sources into fast 304 responses
      # instead of full re-downloads - it never causes stale data, since
      # ensure_cached() always re-validates against the server.
      - name: Cache download cache
        uses: actions/cache@v4
        with:
          path: ~/.cache
          key: sumatora-download-cache-${{ github.run_id }}
          restore-keys: sumatora-download-cache-

      - name: Compute next version and date
        id: version
        run: |
          if [ -f dictionaries.xml ]; then
            CURRENT=$(grep -oP '(?<=version=")[0-9]+' dictionaries.xml | head -1)
          else
            CURRENT=0
          fi
          NEXT=$((CURRENT + 1))
          DATE=$(date -u +%Y%m%d)
          echo "current_version=$CURRENT" >> "$GITHUB_OUTPUT"
          echo "next_version=$NEXT" >> "$GITHUB_OUTPUT"
          echo "date=$DATE" >> "$GITHUB_OUTPUT"
          echo "tag=dictionaries-v$NEXT" >> "$GITHUB_OUTPUT"
          echo "Building version $NEXT ($DATE), tag ${{ github.event.repository.name }}@dictionaries-v$NEXT"

      - name: Build pack languages argument
        id: langs
        run: |
          INPUT="${{ github.event.inputs.pack_langs || 'eng,ger,rus,spa,dut,hun,swe,fre,slv' }}"
          if [ "$INPUT" = "all" ]; then
            echo "flag=--all-pack-languages" >> "$GITHUB_OUTPUT"
          else
            FLAG=""
            IFS=',' read -ra LANGS <<< "$INPUT"
            for lang in "${LANGS[@]}"; do
              FLAG="$FLAG --pack-lang $lang"
            done
            echo "flag=$FLAG" >> "$GITHUB_OUTPUT"
          fi

      - name: Build monolithic DB and packs
        run: |
          python3 build-sumatora-db.py -o output/ --split-packs \
            ${{ steps.langs.outputs.flag }}

      - name: Validate web search pack
        run: |
          python3 - <<'PY'
          import sqlite3

          path = 'output/packs/sumatora_web_search.db'
          db = sqlite3.connect(path)
          assert db.execute('PRAGMA integrity_check').fetchone()[0] == 'ok'
          assert db.execute('PRAGMA page_size').fetchone()[0] == 16384
          columns = {row[1] for row in db.execute('PRAGMA table_info(WebSearchResult)')}
          assert {'entry_id', 'script_order', 'priority', 'entry_score'} <= columns
          assert db.execute('SELECT count(*) FROM WebSearchResult').fetchone()[0] > 0
          top_columns = {
              row[1] for row in db.execute('PRAGMA table_info(WebSearchPrefixTop)')
          }
          assert {
              'script_order', 'prefix', 'priority_class',
              'entry_score', 'entry_id', 'source_key',
          } <= top_columns
          assert db.execute(
              "SELECT count(*) FROM WebSearchPrefixTop"
          ).fetchone()[0] > 0
          max_group = db.execute("""
              SELECT max(cnt) FROM (
                  SELECT count(*) AS cnt FROM WebSearchPrefixTop
                  GROUP BY script_order, prefix, priority_class
              )
          """).fetchone()[0]
          assert max_group <= 80
          db.execute("ATTACH DATABASE 'output/sumatora.db' AS source")
          mismatches = db.execute("""
              SELECT count(*)
              FROM WebSearchResult wr
              JOIN source.SearchTerm st ON st.search_id = wr.search_id
              JOIN source.Entry e ON e.entry_id = st.entry_id
              WHERE wr.entry_id != e.entry_id
                 OR wr.entry_score != e.score
                 OR wr.priority != st.priority
                 OR wr.script_order != CASE st.script
                       WHEN 'writing' THEN 0 WHEN 'kana' THEN 1 ELSE 2 END
          """).fetchone()[0]
          assert mismatches == 0
          rows = db.execute("""
              SELECT entry_id, entry_score
              FROM WebSearchResult
              WHERE search_id IN (
                  SELECT rowid FROM WebSearchFts
                  WHERE normalized MATCH '"test"*'
              )
              ORDER BY entry_score DESC, entry_id
              LIMIT 30
          """).fetchall()
          assert rows
          assert rows == sorted(rows, key=lambda row: (-row[1], row[0]))
          top_rows = db.execute("""
              SELECT source_key
              FROM WebSearchPrefixTop
              WHERE script_order = 1 AND prefix = 'マ' AND priority_class = 1
              ORDER BY entry_score DESC, entry_id
              LIMIT 30
          """).fetchall()
          assert top_rows
          print('web search pack validated')
          PY

      - name: Validate web gloss packs
        run: |
          python3 - <<'PY'
          import glob
          import sqlite3

          checked = 0
          for gloss_path in sorted(glob.glob('output/packs/sumatora_gloss_*.db')):
              lang = gloss_path[len('output/packs/sumatora_gloss_'):-len('.db')]
              path = f'output/packs/sumatora_web_gloss_{lang}.db'
              db = sqlite3.connect(path)
              assert db.execute('PRAGMA integrity_check').fetchone()[0] == 'ok'
              assert db.execute('PRAGMA page_size').fetchone()[0] == 16384
              columns = {row[1] for row in db.execute('PRAGMA table_info(WebGlossPrefixTop)')}
              assert {'prefix', 'sense_ord', 'entry_id', 'source_key'} <= columns
              assert db.execute('SELECT count(*) FROM WebGlossPrefixTop').fetchone()[0] > 0
              max_group = db.execute("""
                  SELECT max(cnt) FROM (
                      SELECT count(*) AS cnt FROM WebGlossPrefixTop GROUP BY prefix
                  )
              """).fetchone()[0]
              assert max_group <= 80

              db.execute("ATTACH DATABASE ? AS gloss", (gloss_path,))
              db.execute("ATTACH DATABASE 'output/packs/sumatora_core.db' AS core")
              # Verify against fts5vocab (the same source the build reads
              # prefixes from), not substr() against the whole gloss string --
              # multi-word glosses tokenize on spaces, so a materialized
              # prefix can legitimately match a non-initial token. A full
              # anti-join over every row is too slow to run per language in
              # CI (fts5vocab's 'instance' mode has no indexed lookup by doc,
              # so each correlated check re-scans it); spot-check the
              # broadest materialized prefix's rows instead, same style as
              # WebSearchPrefixTop's single-prefix spot check above.
              db.execute(
                  "CREATE VIRTUAL TABLE temp.vocab "
                  "USING fts5vocab('gloss', 'GlossSearchFts', 'instance')"
              )
              top_prefix = db.execute("""
                  SELECT prefix FROM WebGlossPrefixTop
                  GROUP BY prefix ORDER BY count(*) DESC LIMIT 1
              """).fetchone()[0]
              sample_ids = [row[0] for row in db.execute(
                  "SELECT entry_id FROM WebGlossPrefixTop WHERE prefix = ? LIMIT 20",
                  (top_prefix,),
              )]
              placeholders = ','.join('?' * len(sample_ids))
              matched = {row[0] for row in db.execute(f"""
                  SELECT DISTINCT s.entry_id
                  FROM temp.vocab v
                  JOIN gloss.SenseGloss sg ON sg.rowid = v.doc
                  JOIN core.Sense s ON s.sense_id = sg.sense_id
                  WHERE s.entry_id IN ({placeholders})
                    AND substr(v.term, 1, length(?)) = ?
              """, sample_ids + [top_prefix, top_prefix])}
              assert set(sample_ids) <= matched, (
                  f'{lang}: prefix {top_prefix!r} rows not backed by a real gloss token'
              )

              exact_columns = {row[1] for row in db.execute('PRAGMA table_info(WebGlossExactTop)')}
              assert {'term', 'sense_ord', 'entry_id', 'source_key'} <= exact_columns
              n_exact = db.execute('SELECT count(*) FROM WebGlossExactTop').fetchone()[0]
              # A small language can legitimately have no term whose exact-
              # match count exceeds the threshold (e.g. Swedish's broadest
              # exact match in real v18 data is 25, well under 50) -- an
              # empty table is correct there, not a bug.
              if n_exact > 0:
                  max_exact_group = db.execute("""
                      SELECT max(cnt) FROM (
                          SELECT count(*) AS cnt FROM WebGlossExactTop GROUP BY term
                      )
                  """).fetchone()[0]
                  assert max_exact_group <= 80
                  top_term = db.execute("""
                      SELECT term FROM WebGlossExactTop
                      GROUP BY term ORDER BY count(*) DESC LIMIT 1
                  """).fetchone()[0]
                  exact_sample_ids = [row[0] for row in db.execute(
                      "SELECT entry_id FROM WebGlossExactTop WHERE term = ? LIMIT 20",
                      (top_term,),
                  )]
                  exact_placeholders = ','.join('?' * len(exact_sample_ids))
                  exact_matched = {row[0] for row in db.execute(f"""
                      SELECT DISTINCT s.entry_id
                      FROM temp.vocab v
                      JOIN gloss.SenseGloss sg ON sg.rowid = v.doc
                      JOIN core.Sense s ON s.sense_id = sg.sense_id
                      WHERE s.entry_id IN ({exact_placeholders}) AND v.term = ?
                  """, exact_sample_ids + [top_term])}
                  assert set(exact_sample_ids) <= exact_matched, (
                      f'{lang}: exact term {top_term!r} rows not backed by a real gloss token'
                  )

              checked += 1
              print(
                  f'  {lang}: {db.execute("SELECT count(*) FROM WebGlossPrefixTop").fetchone()[0]} '
                  f'prefix rows, {db.execute("SELECT count(*) FROM WebGlossExactTop").fetchone()[0]} '
                  'exact rows validated'
              )

          assert checked > 0
          print(f'web gloss packs validated ({checked} languages)')
          PY

      # Stage 1 (inside build-sumatora-db.py, above) just regenerated
      # ~/Code/gitmdict, gitnedict, gitjidic2, gitoeba, gitch from upstream.
      # Push each into its own repo so it stays a reusable, git-diffable
      # artifact independent of this repo's release cadence. Needs a PAT
      # with `contents: write` on all five target repos, since the default
      # GITHUB_TOKEN can only write to this repo -- see sync-stage1-repo.sh's
      # header. Skips (not fails) if the secret isn't configured yet, and
      # won't block the actual dictionary release if a sync fails.
      - name: Sync stage-1 JSON repos
        if: ${{ env.DICT_REPOS_PAT_SET == 'true' }}
        continue-on-error: true
        env:
          GH_SYNC_TOKEN: ${{ secrets.DICT_REPOS_PAT }}
        run: |
          mkdir -p /tmp/stage1-diffs
          DIFF_OUT=/tmp/stage1-diffs/gitmdict.diff  ./sync-stage1-repo.sh ~/Code/gitmdict  HappyPeng2x/gitmdict  entries translations metadata.json
          DIFF_OUT=/tmp/stage1-diffs/gitnedict.diff ./sync-stage1-repo.sh ~/Code/gitnedict HappyPeng2x/gitnedict entries metadata.json
          DIFF_OUT=/tmp/stage1-diffs/gitjidic2.diff ./sync-stage1-repo.sh ~/Code/gitjidic2 HappyPeng2x/gitjidic2 characters metadata.json
          DIFF_OUT=/tmp/stage1-diffs/gitoeba.diff   ./sync-stage1-repo.sh ~/Code/gitoeba   HappyPeng2x/gitoeba   sentences translations metadata.json
          DIFF_OUT=/tmp/stage1-diffs/gitch.diff     ./sync-stage1-repo.sh ~/Code/gitch     HappyPeng2x/gitch     entries metadata.json

      # Unconditional (unlike the sync step above): build-changelog.py treats
      # a missing <repo>.diff as "no changes for that repo", so this never
      # fails even when DICT_REPOS_PAT isn't configured and no diffs exist.
      - name: Build changelog
        run: |
          mkdir -p release
          python3 build-changelog.py \
            --diffs-dir /tmp/stage1-diffs \
            --version ${{ steps.version.outputs.next_version }} \
            --previous-version ${{ steps.version.outputs.current_version }} \
            --date ${{ steps.version.outputs.date }} \
            -o release/changelog.json

      # gitender is the rendering-ready JSON export of output/sumatora.db
      # (built above); gitenderml is Jitendex-styled HTML built from that
      # JSON, for every language gitender has gloss data for. render-entry-
      # html.py skips writing a card for an (entry, lang) pair with no
      # translation at all, rather than emitting a "no translation yet"
      # placeholder for the ~200K entries a low-coverage language lacks, so
      # this stays proportional to actual translated content rather than
      # entry-count x language-count. Needs DICT_REPOS_PAT to include these
      # two repos (same secret as the stage-1 sync above); skips gracefully
      # if unset.
      - name: Build gitender + gitenderml
        if: ${{ env.DICT_REPOS_PAT_SET == 'true' }}
        continue-on-error: true
        run: |
          python3 sumatora-to-git.py -d output/sumatora.db -o ~/Code/gitender
          python3 render-entry-html.py -i ~/Code/gitender -o ~/Code/gitenderml \
            --lang dut --lang eng --lang fre --lang ger --lang hun \
            --lang rus --lang slv --lang spa --lang swe

      - name: Sync gitender + gitenderml
        if: ${{ env.DICT_REPOS_PAT_SET == 'true' }}
        continue-on-error: true
        env:
          GH_SYNC_TOKEN: ${{ secrets.DICT_REPOS_PAT }}
        run: |
          ./sync-stage1-repo.sh ~/Code/gitender   HappyPeng2x/gitender   entries translations
          ./sync-stage1-repo.sh ~/Code/gitenderml HappyPeng2x/gitenderml \
            dut eng fre ger hun rus slv spa swe common.css jitendex.css

      - name: Gzip, checksum, and render dictionaries.xml
        run: |
          python3 release-dictionaries.py \
            --packs-dir output/packs \
            --release-dir release/ \
            --version ${{ steps.version.outputs.next_version }} \
            --date ${{ steps.version.outputs.date }} \
            --download-base-url "https://github.com/${{ github.repository }}/releases/download/${{ steps.version.outputs.tag }}" \
            --changelog-path release/changelog.json \
            -o dictionaries.xml

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          # Idempotent: a retry of a failed run targeting the same version
          # replaces the partial release instead of erroring on "already exists".
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" release/*.db.gz release/*.db release/changelog.json \
            --title "Dictionaries v${{ steps.version.outputs.next_version }} (${{ steps.version.outputs.date }})" \
            --notes "Automated dictionary pack rebuild. See dictionaries.xml on master for the current manifest."

      - name: Commit updated manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dictionaries.xml
          if git diff --cached --quiet; then
            echo "dictionaries.xml unchanged, nothing to commit"
          else
            git commit -m "Release dictionaries v${{ steps.version.outputs.next_version }} (${{ steps.version.outputs.date }})"
            git push origin HEAD:master
          fi
